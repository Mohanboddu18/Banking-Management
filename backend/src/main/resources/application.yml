server:
  port: ${PORT:8080}

spring:
  application:
    name: online-banking
  datasource:
    url: ${DB_URL:jdbc:h2:mem:bankingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      format_sql: true
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}

bank:
  app:
    jwtSecret: ${JWT_SECRET:BankingManagementSuperSecretKey2026GodavariBankSimulationSecureToken9876543210987654321}
    jwtExpirationMs: ${JWT_EXPIRATION_MS:86400000} # 24 Hours
    ifscPrefix: "GDVB"
    branchCode: "000123"
    branchName: "Godavari Bank Main Branch, Rajahmundry"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
