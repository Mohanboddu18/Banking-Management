server:
  port: ${PORT:8080}

spring:
  application:
    name: online-banking
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/banking_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:mohan}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}

bank:
  app:
    jwtSecret: ${JWT_SECRET:BankingManagementSuperSecretKey2026GodavariBankSimulationSecureToken9876543210987654321}
    jwtExpirationMs: ${JWT_EXPIRATION_MS:86400000} # 24 Hours
    ifscPrefix: "GDVB"
    branchCode: "000123"
    branchName: "Godavari Bank Main Branch, Rajahmundry"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
