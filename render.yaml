services:
  # =========================================================================
  # Godavari Bank Spring Boot Backend Web Service on Render
  # =========================================================================
  - type: web
    name: godavari-bank-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        value: jdbc:h2:mem:bankingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
      - key: DB_USERNAME
        value: sa
      - key: DB_PASSWORD
        value: ""
      - key: DB_DRIVER
        value: org.h2.Driver
      - key: JWT_SECRET
        generateValue: true
      - key: HIBERNATE_DDL_AUTO
        value: update
      - key: SQL_INIT_MODE
        value: never
